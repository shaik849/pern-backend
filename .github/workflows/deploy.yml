name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR branch
        run: |
          git fetch origin ${{ github.head_ref }}

      - name: Generate PR diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > diff.txt
          echo "Diff lines:"
          wc -l diff.txt

      # 🔥 Split diff into chunks (like CodeTurtle)
      - name: Chunk diff
        run: |
          mkdir -p chunks
          split -l 400 diff.txt chunks/diff_

      # 🔥 Call your API for each chunk
      - name: Send chunks to Review API
        run: |
          echo "" > combined_review.md

          for CHUNK in chunks/*; do
            DIFF=$(jq -Rs . < "$CHUNK")

            RESPONSE=$(curl -s -X POST http://13.127.98.233/api/review \
              -H "Content-Type: application/json" \
              -d "{\"diff\":$DIFF}")

            echo "$RESPONSE" | jq -r '
              if .data then
                "## 🤖 AI Review\n\n" +
                "**Status:** " + (.data.status // "N/A") + "\n\n" +
                "**Summary:**\n" + (.data.summary // "N/A") + "\n\n" +
                "**Changes:**\n" + ((.data.changes // []) | join("\n")) + "\n\n" +
                "**Issues:**\n" + ((.data.issues // []) | join("\n")) + "\n\n" +
                "**Suggestions:**\n" +
                ((.data.suggestions // [])
                  | map("- " + .file + ":" + .line + " → " + .message)
                  | join("\n"))
              else
                "⚠️ Invalid response from API"
              end
            ' >> combined_review.md

            echo -e "\n---\n" >> combined_review.md
          done

      # 🔥 Post comment on PR
      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(cat combined_review.md)"

          if [ -z "$BODY" ]; then
            BODY="⚠️ AI review failed or empty response."
          fi

          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -d "$(jq -n --arg body "$BODY" '{body: $body}')"

      # 🔥 Optional: Fail PR if BLOCKED
      - name: Fail if BLOCKED
        run: |
          STATUS=$(grep -o '"status": *"[^"]*"' combined_review.md | head -1 | cut -d'"' -f4)

          echo "Detected Status: $STATUS"

          if [ "$STATUS" = "BLOCKED" ]; then
            echo "❌ PR Blocked by AI"
            exit 1
          fi

      # 🔥 Optional: Add label
      - name: Add ai-reviewed label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
            -d '{"labels":["ai-reviewed"]}'
